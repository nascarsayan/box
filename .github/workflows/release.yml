name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          # Static, so the binary runs on any glibc or musl host -- and, crucially,
          # both inside and outside the sandbox's chroot, where the nix store is
          # not mounted.
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${version}" = "" ] && version=dev
          # -trimpath strips the VCS stamps Go embeds for local builds, so the
          # commit and build date have to be passed explicitly for releases.
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "box-linux-${{ matrix.goarch }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: box-linux-${{ matrix.goarch }}
          path: box-linux-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum box-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            box-linux-*
            SHA256SUMS
          generate_release_notes: true
